<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d0d2e">
  <title>VTuber Owl</title>
  <link rel="stylesheet" href="style.css">

  <!-- Live2D Cubism Core（Live2D 公式の配布 URL） -->
  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.3.2/dist/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
</head>
<body>

  <!-- Live2D canvas -->
  <canvas id="canvas"></canvas>

  <!-- Start screen -->
  <div id="start-screen">
    <div class="start-card">
      <div class="owl-icon">🦉</div>
      <h1>VTuber Owl</h1>
      <p>カメラとマイクを使って<br>キャラクターを動かします</p>
      <button id="start-btn">はじめる</button>
    </div>
  </div>

  <!-- エラー表示 -->
  <div id="message" hidden></div>

  <!-- HUD -->
  <div id="hud">
    <div id="status-bar">
      <span class="status-item">
        <span id="status-face" class="dot">○</span> 顔
      </span>
      <span class="status-item">
        <span id="status-audio" class="dot">○</span> マイク
      </span>
    </div>

    <!-- Volume meter -->
    <div id="vol-meter">
      <div id="vol-bar"></div>
    </div>

    <!-- Threshold control -->
    <details id="settings">
      <summary>⚙️ 感度設定</summary>
      <div class="settings-row">
        <label>口開きしきい値</label>
        <input id="threshold-slider" type="range" min="0.005" max="0.08" step="0.005" value="0.02">
        <span id="threshold-value">0.02</span>
      </div>
    </details>

    <!-- Voice changer -->
    <details id="voice">
      <summary>🎤 ボイスチェンジャー</summary>
      <div class="settings-row">
        <label for="voice-preset">プリセット</label>
        <select id="voice-preset">
          <option value="none">なし</option>
          <option value="high">高い声</option>
          <option value="cute">かわいい声</option>
          <option value="low">低い声</option>
          <option value="giant">巨人</option>
          <option value="robot">ロボット</option>
          <option value="custom" hidden>カスタム</option>
        </select>
      </div>
      <div class="settings-row">
        <label for="pitch-slider">声の高さ</label>
        <input id="pitch-slider" type="range" min="-12" max="12" step="1" value="0">
        <span id="pitch-value">0</span>
      </div>
      <div class="settings-row">
        <label><input id="robot-check" type="checkbox"> ロボット声</label>
      </div>
      <div class="settings-row">
        <label><input id="monitor-check" type="checkbox"> 変えた声を再生する</label>
      </div>
      <p class="note">スピーカーだとハウリングするのでイヤホン推奨。配信では OBS 等でブラウザの音声を取り込んでください。</p>
    </details>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
